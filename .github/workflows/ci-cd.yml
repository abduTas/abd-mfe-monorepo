name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.filter.outputs.state }}
      shell: ${{ steps.filter.outputs.shell }}
      host: ${{ steps.filter.outputs.host }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            state:
              - 'apps/state/**'
            shell:
              - 'apps/shell/**'
            host:
              - 'apps/host/**'
            root:
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'

  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_MFE_SHELL_URL: ${{ vars.NEXT_PUBLIC_MFE_SHELL_URL }}
      NEXT_PUBLIC_MFE_STATE_URL: ${{ vars.NEXT_PUBLIC_MFE_STATE_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Code Formatting
        run: npm run format:check

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build All Apps
        run: npm run build

  deploy-state:
    name: Deploy State Remote
    needs: [changes, ci]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.ci.result == 'success' &&
      (needs.changes.outputs.state == 'true' || needs.changes.outputs.root == 'true')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/state
      - run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/state
      - run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/state

  deploy-shell:
    name: Deploy Shell Remote
    needs: [changes, ci, deploy-state]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.ci.result == 'success' &&
      (needs.deploy-state.result == 'success' || needs.deploy-state.result == 'skipped') &&
      (needs.changes.outputs.shell == 'true' || needs.changes.outputs.state == 'true' || needs.changes.outputs.root == 'true')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SHELL }}
      NEXT_PUBLIC_MFE_STATE_URL: ${{ vars.NEXT_PUBLIC_MFE_STATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/shell
      - run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/shell
      - run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/shell

  deploy-host:
    name: Deploy Host
    needs: [changes, ci, deploy-shell]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.ci.result == 'success' &&
      (needs.deploy-shell.result == 'success' || needs.deploy-shell.result == 'skipped') &&
      (needs.changes.outputs.host == 'true' || needs.changes.outputs.root == 'true')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_HOST }}
      NEXT_PUBLIC_MFE_SHELL_URL: ${{ vars.NEXT_PUBLIC_MFE_SHELL_URL }}
      NEXT_PUBLIC_MFE_STATE_URL: ${{ vars.NEXT_PUBLIC_MFE_STATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/host
      - run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/host
      - run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/host
